<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG CORS Bug Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            border: 2px solid #ccc;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>
    <h1>SVG CORS Bug Demo</h1>
    
    <div class="container">
        <h2>Original SVG (Static)</h2>
        <svg width="100" height="100">
            <image href="http://localhost:3000/favicon" width="100" height="100" crossorigin="anonymous"/>
        </svg>
    </div>

    <button onclick="insertSVG()">Insert SVG Dynamically</button>

    <div class="container">
        <h2>Dynamically Inserted SVG</h2>
        <div id="dynamic-svg"></div>
    </div>

    <script>
        function insertSVG() {
            const svgCode = `
                <svg width="100" height="100">
                    <image href="http://localhost:3000/favicon" width="100" height="100" crossorigin="anonymous"/>
                </svg>
            `;
            document.getElementById('dynamic-svg').innerHTML = svgCode;
        }
    </script>
</body>
</html>
